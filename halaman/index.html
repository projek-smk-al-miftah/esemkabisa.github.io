<section id="produk">
    <h2>Daftar Alat-Alat Elektronik</h2>

    <input
        type="text"
        id="pencarian"
        placeholder="Cari laptop, handphone, mouse..."
    >

    <div class="kategori-menu">
        <button onclick="filterKategori('Semua')">
            Semua
        </button>

        <button onclick="filterKategori('Komputer')">
            Komputer
        </button>

        <button onclick="filterKategori('Handphone')">
            Handphone
        </button>

        <button onclick="filterKategori('Aksesoris')">
            Aksesoris
        </button>

        <button onclick="filterKategori('Audio')">
            Audio
        </button>

        <button onclick="filterKategori('Kamera')">
            Kamera
        </button>

        <button onclick="filterKategori('Elektronik Rumah')">
            Elektronik Rumah
        </button>
    </div>

    <div id="daftar-produk" class="daftar-produk"></div>
</section>

<section id="keranjang">
    <h2>Keranjang Belanja</h2>

    <p>
        Jumlah barang:
        <span id="jumlah-keranjang">0</span>
    </p>

    <p>
        Total harga:
        <span id="total-harga">Rp0</span>
    </p>

    <div id="isi-keranjang"></div>

    <button onclick="kosongkanKeranjang()">
        Kosongkan Keranjang
    </button>
</section>
